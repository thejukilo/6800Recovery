      - "127.0.0.1:5002:5002"
    volumes:
      - /opt/roche/etc/mollab/private/troubleshooting:/app/config:ro
      - /opt/roche/etc/mollab/shared:/app/shared-config:ro
      - /opt/roche/var/lib/mollab/private/troubleshooting:/app/data
      - /opt/roche/var/lib/mollab/shared:/app/shared-data
    environment:
      - ASPNETCORE_URLS=https://+:5002
      - ASPNETCORE_HTTPS_PORT=5002
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/shared-data/certificates/x800-certificate.p12
      - MolLab_SerialNumber
      - MolLab_InstrumentType
    logging:
      driver: journald
    network_mode: "slirp4netns:allow_host_loopback=true"
    oom_score_adj: 1000
    extra_hosts:
      - rabbitmq-server:10.0.2.2
      - otel:10.0.2.2
