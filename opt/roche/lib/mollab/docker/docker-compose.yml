volumes:
  rabbitmq:
    name: rabbitmq

services:
  rabbitmq:
    mem_limit: 1G
    image: eu.repository.roche.com/mollab-general-docker-all-v/mollab-rabbitmqserver-podman:1.2.1.1316995
    container_name: rabbitmq
    profiles: ["infrastructure"]
    volumes:
      - /opt/roche/etc/mollab/private/rabbitmq/definitions:/etc/rabbitmq/definitions/:ro
      - rabbitmq:/var/lib/rabbitmq
      - /opt/roche/var/lib/mollab/shared/logs:/var/log/rabbitmq
    network_mode: "host"
    oom_score_adj: 1000

  loggingserver:
    mem_limit: 256M
    image: eu.repository.roche.com/mollab-general-docker-all-l/mollab-loggingserver:2.0.1.1331730
    container_name: loggingserver
    profiles: ["infrastructure"]
    volumes:
      - /opt/roche/var/lib/mollab/shared/tmp/ic_unit_logs_socket:/tmp/log/
      - /opt/roche/var/lib/mollab/shared/logs:/var/log
    network_mode: "slirp4netns"
    oom_score_adj: 1000

  jaeger:
    mem_limit: 256M
    image: eu.repository.roche.com/mollab-general-docker-all-l/mollab-jaeger:1.1.0.887478
    container_name: jaeger
    profiles: ["infrastructure"]
    volumes:
      - /opt/roche/var/lib/mollab/private/jaeger:/usr/share/data
    ports:
      - "4318:4318"     # agent - OTLP over HTTP
      - "5778:5778"     # agent - config, sampling strategies
      - "16685:16685"   # query - grpc
      - "16686:16686"   # query - frontend
    network_mode: "slirp4netns"
    oom_score_adj: 1000

  rsa2l:
    mem_limit: 256M
    image: eu.repository.roche.com/mollab-general-docker-all-l/mollab-rsa2l:1.1.0.943455
    container_name: rsa2l
    profiles: ["6800_1AC", "6800_2AC", "8800"]
    volumes:
      - /opt/roche/etc/mollab/private/rsa2l:/app/config:ro
      - /opt/roche/var/lib/mollab/private/rsa2l/config:/app/RSA2L/config
      - /opt/roche/var/lib/mollab/private/rsa2l/upload:/app/gateway/upload/
      - /opt/roche/var/lib/mollab/shared:/app/shared-data
    environment:
      MolLab_SerialNumber:
      MolLab_InstrumentType:
    logging:
      driver: journald
    network_mode: "slirp4netns"
    oom_score_adj: 1000
    user: root

  heatingstation.a1:
    mem_limit: 128M
    image: rmd-x800family-docker.repository-ng.intranet.roche.com/newgen-heatingstation:3.1.1.1340653
    container_name: heatingstation.a1
    profiles: ["6800_1AC", "6800_2AC", "8800"]
    ulimits:
      memlock: -1
      rtprio: -1
      nice: -20
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    volumes:
      - /opt/roche/etc/mollab/private/heating-station/a1/:/opt/roche/config/settings/:ro
      - /opt/roche/etc/mollab/shared/fieldbus-definition-files/${MolLab_InstrumentType}:/opt/roche/config/fieldbus-definition-files:ro
      - /opt/roche/var/lib/mollab/shared/tmp/ic_unit_logs_socket:/var/run/log/
      - /opt/roche/var/lib/mollab/shared/tmp/ic_external_sockets:/tmp
    environment:
      UNIT_INSTANCE_ID: "A1"
      UNIT_FULL_NAME: "HeatingStation"
      UNIT_SHORT_NAME: "HS"
      UNITCONFIGPATH: "/opt/roche/config/"
      MolLab_SerialNumber:
      MolLab_InstrumentType:
    network_mode: "slirp4netns:allow_host_loopback=true"
    oom_score_adj: 1000
    extra_hosts:
      - rabbitmq-server:10.0.2.2
      - otel:10.0.2.2

